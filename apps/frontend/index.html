<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />
    <title>Ask Quivr</title>
    <script>
      // Set the theme class before first paint (see src/theme/useTheme.ts).
      try {
        var stored = localStorage.getItem('theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
